<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Leagues</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap');
        body { background-color: #050505; color: #fff; font-family: Arial, sans-serif; font-weight: bold; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-y: auto; text-align: center; }
        .menu-container { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 1100px; padding: 20px; box-sizing: border-box; }
        
        .shield-btn { background: #111; border: 4px solid; border-radius: 15% 15% 50% 50% / 10% 10% 60% 60%; color: inherit; width: 180px; height: 220px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 0 20px currentColor; }
        .shield-btn:hover { background: currentColor; color: #000; }
        .shield-number { font-family: 'MedievalSharp', serif; font-size: 56px; line-height: 1; }
        .shield-name { font-size: 24px; text-transform: uppercase; }

        .iron-color { color: #7a7a7a; } .copper-color { color: #ffa500; } .bronze-color { color: #8b4513; } .silver-color { color: #c0c0c0; } 
        .gold-color { color: #ffd700; } .titanium-color { color: #7886a0; } .platinum-color { color: #ffffff; } .diamond-color { color: #00ffff; }

        #league-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        #set-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .set-shield { width: 160px; height: 180px; font-size: 24px; border-width: 3px; }

        .back-btn { background: transparent; border: 2px solid #555; color: #555; padding: 10px 30px; font-size: 20px; cursor: pointer; text-transform: uppercase; border-radius: 5px; margin: 10px; }
        .back-btn:hover { background: #555; color: #fff; }

        #flashcard-area { display: none; width: 100%; height: 100vh; position: relative; }
        .hud { position: absolute; top: 20px; font-size: 20px; font-family: monospace; color: #888; }
        
        #sentence-container { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 90%; display: flex; flex-direction: column; gap: 20px; }
        
        .dict-word { color: #ffe81f; border-bottom: 2px dotted #ffe81f; cursor: pointer; font-size: inherit; }
        #translation-panel { font-size: 32px; color: #0f0; margin: 10px; min-height: 40px; font-family: monospace; text-transform: uppercase; }

        .sentence { font-size: 4vw; }
        .state-turkish { color: #ffffff; } 
        .state-english { color: #00ffff; } 

        .touch-controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
        .touch-btn { background: rgba(0,0,0,0.8); border: 2px solid #555; color: #fff; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }

        @media (max-width: 800px) {
            #league-grid { grid-template-columns: repeat(2, 1fr); }
            .sentence { font-size: 6vw; }
        }
    </style>
</head>
<body>

    <div id="main-menu" class="menu-container">
        <h1>SELECT LEAGUE</h1>
        <div id="league-grid">
            <button class="shield-btn iron-color" onclick="showSets('iron')"><span class="shield-number">1</span><span class="shield-name">Iron</span></button>
            <button class="shield-btn copper-color" onclick="showSets('copper')"><span class="shield-number">2</span><span class="shield-name">Copper</span></button>
            <button class="shield-btn bronze-color" onclick="showSets('bronze')"><span class="shield-number">3</span><span class="shield-name">Bronze</span></button>
            <button class="shield-btn silver-color" onclick="showSets('silver')"><span class="shield-number">4</span><span class="shield-name">Silver</span></button>
            <button class="shield-btn gold-color" onclick="showSets('gold')"><span class="shield-number">5</span><span class="shield-name">Gold</span></button>
            <button class="shield-btn titanium-color" onclick="showSets('titanium')"><span class="shield-number">6</span><span class="shield-name">Titanium</span></button>
            <button class="shield-btn platinum-color" onclick="showSets('platinum')"><span class="shield-number">7</span><span class="shield-name">Platinum</span></button>
            <button class="shield-btn diamond-color" onclick="showSets('diamond')"><span class="shield-number">8</span><span class="shield-name">Diamond</span></button>
        </div>
    </div>

    <div id="set-menu" class="menu-container" style="display: none;">
        <h1 id="set-menu-title">CHOOSE A SET</h1>
        <div id="set-buttons"></div>
        <button class="back-btn" onclick="showMainMenu()">Back to Leagues</button>
    </div>

    <div id="flashcard-area">
        <div id="progress-hud" class="hud">Set: <span id="hud-set">1</span><br>Card <span id="hud-current">0</span> / <span id="hud-total">0</span></div>
        <div id="score-hud" class="hud" style="right: 20px;">Correct: <span id="hud-correct" style="color: #0f0;">0</span><br>Failed: <span id="hud-failed" style="color: #f00;">0</span></div>
        
        <div id="sentence-container">
            <div id="turkish-text" class="sentence state-turkish"></div>
            <div id="translation-panel"></div>
            <div id="english-text" class="sentence state-english" style="visibility: hidden;"></div>
        </div>
        
        <div class="touch-controls">
            <button class="touch-btn" onclick="handleAction('reveal')">👁️ Reveal</button>
            <button class="touch-btn" style="border-color: #f00;" onclick="handleAction('fail')">❌ Fail</button>
            <button class="touch-btn" style="border-color: #0f0;" onclick="handleAction('pass')">✅ Correct</button>
            <button class="touch-btn" onclick="handleAction('undo')">↩️ Undo</button>
            <button class="touch-btn" style="border-color: #ffe81f;" onclick="handleAction('exit')">Exit</button>
        </div>
    </div>

    <div id="results-screen" class="menu-container" style="display: none; height: 100vh;">
        <h1>RESULTS</h1>
        <div id="res-percentage" style="font-size: 48px; color: orange;">0%</div>
        <div id="failed-prompt-area" style="display: none;">
            <p>CONTINUE WITH FAILED ITEMS? (<span id="failed-count">0</span>)</p>
            <button class="back-btn" onclick="startFailedReview()">YES</button>
            <button class="back-btn" onclick="closeFailedReview()">NO</button>
        </div>
        <div id="standard-result-buttons">
            <button class="back-btn" onclick="showSets(currentLeague)">Back to Sets</button>
        </div>
    </div>

    <script>
        const dictionary = {
            "teminatını": "deposit", "teminat": "deposit", "şanzımanı": "transmission", "şanzıman": "transmission", 
            "bayi": "dealer", "gümrük": "customs", "yedek": "spare", "bursunu": "scholarship", "burs": "scholarship", 
            "tezini": "thesis", "onay": "approval", "vize": "visa", "pazarlık": "bargain", "toptan": "in bulk", 
            "iflas": "bankrupted", "kriz": "crisis", "sorun": "problem"
        };
        const vocabularyData = { /* (Your data structure stays here) */ };
        
        // Revised apply function for better mobile compatibility
        function applyDictionary(text) {
            return text.split(" ").map(word => {
                let clean = word.toLowerCase().replace(/[.,!?]/g, "");
                if (dictionary[clean]) {
                    return `<span class="dict-word" data-trans="${dictionary[clean]}">${word}</span>`;
                }
                return word;
            }).join(" ");
        }

        // Global Event Listener for Dict-Clicks
        document.body.addEventListener('click', function(e) {
            if (e.target.classList.contains('dict-word')) {
                const trans = e.target.getAttribute('data-trans');
                const panel = document.getElementById('translation-panel');
                panel.innerText = trans;
                setTimeout(() => { panel.innerText = ""; }, 2500);
            }
        });

        function displayCard() {
            document.getElementById('turkish-text').innerHTML = applyDictionary(activeDeck[currentIndex].tr);
            document.getElementById('english-text').innerText = activeDeck[currentIndex].en;
            document.getElementById('english-text').style.visibility = 'hidden';
            document.getElementById('translation-panel').innerText = "";
            isFlipped = false;
        }

        // ... (Keep existing game logic intact)
    </script>
</body>
</html>
